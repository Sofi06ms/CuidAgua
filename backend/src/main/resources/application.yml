server:
  port: 8080

spring:
  application:
    name: cuidagua-api

  # Conexión a PostgreSQL: los valores se leen de variables de entorno
  # (en Codespaces las define backend/docker-compose.dev.yml).
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crea Flyway; Hibernate solo verifica que coincidan con las entidades.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # Fechas en formato ISO-8601 (ej. 2026-11-20T08:00:00), cómodo para Flutter.
    serialization:
      write-dates-as-timestamps: false

# Validación de tokens JWT emitidos por Keycloak (ver config/KeycloakJwtConfig.java).
# - KEYCLOAK_ISSUER_URI: issuer principal (valor por defecto de las otras dos variables).
# - KEYCLOAK_ISSUERS: issuers aceptados, separados por comas (localhost, 10.0.2.2, IP de la red...).
# - KEYCLOAK_JWK_SET_URI: de dónde la API descarga las llaves públicas para verificar la firma.
cuidagua:
  keycloak:
    issuers: ${KEYCLOAK_ISSUERS:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/cuidagua}}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/cuidagua}/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Documentación OpenAPI: JSON en /v3/api-docs y Swagger UI en /swagger-ui.html
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
